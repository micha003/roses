{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block nav %}
<a href="{{ url_for('auth.register') }}" class="nav-link primary">Create Account</a>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue sending roses.</p>
    
    <form method="post" action="/login">
        {{ csrf_token }}
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>
        
        <button type="submit">
            <span>Sign In</span>
            <span aria-hidden="true">&rarr;</span>
        </button>
    </form>
    
    <div class="auth-footer">
        <p>Don&apos;t have an account? <a href="{{ url_for('auth.register') }}" class="link-underline">Create one here</a></p>
    </div>
</div>
{% endblock %}
