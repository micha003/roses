{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block nav %}
<a href="{{ url_for('auth.login') }}" class="nav-link">Sign In</a>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Join Roses</h1>
    <p class="auth-subtitle">Create an account to start spreading love.</p>
    
    <form method="post" action="/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Create a strong password"
                autocomplete="new-password"
                required
            >
        </div>
        
        <button type="submit">
            <span>Create Account</span>
            <span aria-hidden="true">&rarr;</span>
        </button>
    </form>
    
    <div class="auth-footer">
        <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="link-underline">Sign in here</a></p>
    </div>
</div>
{% endblock %}
